<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auroom — Интернет-магазин</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; color: #333; }
        header { background-color: #fff; text-align: center; padding: 40px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        header h1 { margin: 0; color: #111; font-size: 2.5em; }
        header p { color: #666; font-size: 1.1em; margin-top: 10px; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .product-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.2s; display: flex; flex-direction: column; }
        .product-card:hover { transform: translateY(-5px); }
        .product-img { width: 100%; height: 280px; object-fit: cover; background-color: #eaeaea; }
        .product-info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .product-title { font-size: 1.3em; margin: 0 0 10px 0; color: #222; }
        .product-price { font-size: 1.4em; font-weight: bold; color: #00b533; margin-bottom: 15px; }
        .btn { display: block; text-align: center; padding: 12px; border-radius: 8px; font-weight: bold; text-decoration: none; margin-top: 8px; transition: background 0.2s; }
        .btn-avito { background-color: #00aa46; color: white; }
        .btn-avito:hover { background-color: #008f3a; }
        .btn-tg { background-color: #229ED9; color: white; }
        .btn-tg:hover { background-color: #1c85b8; }
    </style>
</head>
<body>

    <header>
        <h1>Auroom</h1>
        <p>Качественные кепки, шапки, бейсболки и инструменты с доставкой через Авито!</p>
    </header>

    <div class="container">
        <div class="products-grid">

            <!-- ТОВАР 1 -->
            <div class="product-card">
                <img class="product-img" src="https://unsplash.com" alt="Бейсболка">
                <div class="product-info">
                    <h3 class="product-title">Стильная бейсболка</h3>
                    <div class="product-price">1 200 ₽</div>
                    <a href="#" target="_blank" class="btn btn-avito">Купить на Авито</a>
                    <a href="#" target="_blank" class="btn btn-tg">Задать вопрос в Telegram</a>
                </div>
            </div>

            <!-- ТОВАР 2 -->
            <div class="product-card">
                <img class="product-img" src="https://unsplash.com" alt="Набор инструментов">
                <div class="product-info">
                    <h3 class="product-title">Набор инструментов</h3>
                    <div class="product-price">4 500 ₽</div>
                    <a href="#" target="_blank" class="btn btn-avito">Купить на Авито</a>
                    <a href="#" target="_blank" class="btn btn-tg">Задать вопрос в Telegram</a>
                </div>
            </div>

            <!-- ТОВАР 3 -->
            <div class="product-card">
                <img class="product-img" src="https://unsplash.com" alt="Шапка">
                <div class="product-info">
                    <h3 class="product-title">Вязаная зимняя шапка</h3>
                    <div class="product-price">900 ₽</div>
                    <a href="#" target="_blank" class="btn btn-avito">Купить на Авито</a>
                    <a href="#" target="_blank" class="btn btn-tg">Задать вопрос в Telegram</a>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
